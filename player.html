<!doctype html>
<html>

<head>
  <meta charset="utf-8" />
  <meta name="referrer" content="strict-origin-when-cross-origin" />
  <title>WINAMP</title>
  <link rel="stylesheet" href="player.css" />
</head>

<body>
  <div class="container">
    <div class="maxamp-container">
      <!-- first section : commands-->
      <div class="top-container">
        <div class="title">
          <div class="line line-first"></div>
          <h1>WINAMP</h1>
          <div class="line line-first"></div>
          <button
            class="shade-toggle-btn"
            type="button"
            title="Enter shade mode"
            aria-label="Enter shade mode"
            aria-pressed="false"
          >▴</button>
        </div>

        <div class="cmd-container">
          <!-- Controls row -->
          <div class="load-row">
            <select class="youtube-tab-selector" aria-label="Choose a YouTube tab">
              <option value="">Finding YouTube tabs...</option>
            </select>
            <button class="connect-btn" title="Connect or switch YouTube tab" aria-label="Connect or switch YouTube tab">
              CONNECT
            </button>
            <button class="disconnect-btn" title="Disconnect from YouTube" aria-label="Disconnect from YouTube">
              DISCONNECT
            </button>
          </div>

          <div class="time-container">
            <div class="time-container--left">
              <button class="time-displayer" type="button" title="Click to show remaining time">
                00:00 / 00:00
              </button>
            </div>

            <div class="time-container--right">
              <!-- Winamp-like title row (seamless marquee + mini viz) -->
              <div class="track-row">
                <img class="now-playing-thumbnail" alt="" hidden />
                <div class="track-title-marquee">
                  <div class="track-title-inner">
                    <span class="track-title-text"></span>
                    <span class="track-title-text clone"></span>
                  </div>
                </div>

                <!-- tiny winamp-like viz -->
                <canvas class="visualisation viz-mini" width="96" height="24" aria-hidden="true"></canvas>
              </div>

              <div class="volume">
                <button class="mute-btn" type="button" title="Mute audio" aria-label="Mute audio" aria-pressed="false">
                  MUTE
                </button>
                <input class="volume-controller" type="range" min="0" max="100" value="100" step="1" aria-label="Volume" />
              </div>
            </div>
          </div>

          <div class="progress-container">
            <input class="progress-bar" type="range" min="0" max="1" value="0" step=".000001" aria-label="Playback position" />
          </div>

          <div class="btn-container">
            <div class="btn-container--1">
              <button class="nav-btn" data-nav="prev" title="Previous" aria-label="Previous track">
                ⏮
              </button>
              <button class="play-btn" title="Play" aria-label="Play">▶</button>
              <button class="pause-btn" title="Pause" aria-label="Pause">⏸</button>
              <button class="stop-btn highlighted" title="Stop" aria-label="Stop">⏹</button>
              <button class="nav-btn" data-nav="next" title="Next" aria-label="Next track">⏭</button>
            </div>

            <div class="btn-container--2">
              <button class="shuffle-btn" title="Shuffle" aria-label="Toggle shuffle" aria-pressed="false">SHUFFLE</button>
              <button class="repeat-btn" title="Repeat" aria-label="Toggle repeat mode" aria-pressed="false">🔁</button>
            </div>

            <div class="logo" title="Winamp">⚡</div>
          </div>

          <div class="status-bar">
            <button class="connected-tab-status" type="button" hidden title="Choose another YouTube tab"></button>
            <span class="status-text" role="status" aria-live="polite" aria-atomic="true">Idle.</span>
          </div>
        </div>
      </div>

      <!-- second section : playlist-->
        <div class="playlist-container">
          <div class="title resizable">
            <div class="line line-other"></div>
            <h2>WINAMP PLAYLIST</h2>
            <div class="line line-other"></div>
          </div>

          <div class="playlist">
            <div class="playlist-hint-row">
              <div class="hint playlist-hint">
                Playlist is read from the selected YouTube tab.
              </div>
              <button class="show-playlist-btn" type="button" hidden>
                SHOW PLAYLIST ON YOUTUBE
              </button>
            </div>

            <div class="playlist-tools">
              <input class="playlist-search" type="text" placeholder="Search playlist..." autocomplete="off"
                aria-label="Search playlist items"
                spellcheck="false" />
              <button
                class="playlist-sort-btn"
                type="button"
                aria-pressed="false"
                aria-label="Toggle alphabetical sort"
                title="Toggle alphabetical sort"
              >
                <svg
                  xmlns="http://www.w3.org/2000/svg"
                  width="14"
                  height="14"
                  fill="currentColor"
                  viewBox="0 0 16 16"
                  class="playlist-sort-icon"
                  aria-hidden="true"
                >
                  <path fill-rule="evenodd" d="M10.082 5.629 9.664 7H8.598l1.789-5.332h1.234L13.402 7h-1.12l-.419-1.371zm1.57-.785L11 2.687h-.047l-.652 2.157z"/>
                  <path d="M12.96 14H9.028v-.691l2.579-3.72v-.054H9.098v-.867h3.785v.691l-2.567 3.72v.054h2.645zm-8.46-.5a.5.5 0 0 1-1 0V3.707L2.354 4.854a.5.5 0 1 1-.708-.708l2-1.999.007-.007a.5.5 0 0 1 .7.006l2 2a.5.5 0 1 1-.707.708L4.5 3.707z"/>
                </svg>
              </button>
            </div>

            <div class="playlist-items" role="listbox" aria-label="Playlist items"></div>

            <div class="now-playing"></div>
          </div>
        </div>

      </div>
    </div>
  </div>

  <script type="module" src="player.js"></script>
</body>

</html>
