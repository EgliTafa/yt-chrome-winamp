name: CI

on:
  push:
  pull_request:

jobs:
  validate-extension:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate manifest and key files
        run: |
          node -e "const fs=require('fs'); const m=JSON.parse(fs.readFileSync('manifest.json','utf8')); if(!m.manifest_version||m.manifest_version!==3){throw new Error('manifest_version must be 3')} if(!m.background?.service_worker){throw new Error('background.service_worker missing')} if(!Array.isArray(m.permissions)){throw new Error('permissions missing')}"
          test -f content-script.js
          test -f player.js
          test -f player.html
          test -f player.css

      - name: Ensure README exists
        run: test -f README.md

      - name: Run unit tests
        run: npm test
